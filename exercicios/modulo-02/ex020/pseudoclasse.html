<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudoclasses</title>
    <style>
        div {
            display: inline-block; /*Alinhar na mesma linha*/
            background-color: lightgrey;
            border: 1px solid black; /*Shorthand (sequencia) -> largura, tipo e cor */
            text-align: center;
            height: 200px; /*Altura*/
            width: 200px;  /*Largura*/
        }
        /*pesudoclasse e relacionado ao estado de um elemento. ex: se esta ativo, marcado, vazio, habilitado.*/
        div:hover { /*hover e uma pseudoclasse, para usar pseudoclasses precisa de dois pontos*/
            /*Hover significa quando eu passar o mouse por cima (div so vai ficar amarela quando eu passar o mouse por cima)*/
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>
</body>
</html>
