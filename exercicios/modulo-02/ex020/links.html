<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /*
        #  = id
        .  = class
        :  = pseudo-class
        :: = pseudo-elements
        >  = children
        */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a { /*Caso queira deixar todos os links na mesma cor, sem diferenca do visitado e nao visitado*/
            color: red;
            text-decoration: none; /*Tira o sublinhado*/
        }

        a:visited { /*Caso ja visitado vai ficar nessa cor*/
            color: darkred;
        }

        a:hover { /*Quando passar o mouse em cima(hover) fica preto e sublinhado*/
            text-decoration: underline;
            color: black;
        }

        a:active { /*Quando clicado fica amarelo*/
            color: yellow;
        }
        /*Pseudoclasses usa apenas : -> Define estados de elementos dentro do HTML
          Pseudoelementos usa :: -> Mexe no conteudo do elemento
        */

        a::after { /*depois de todos os link vou adicionar [link]*/
            content: '⇐';
            text-decoration: none;
            font-weight: normal;
        }

        a::before {
            content: '⇒';
        }
        
        .especial::after { /*Apos a classe especial contem um coracao*/
            content: ' \2665';
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>                                             <!--Target abre o link em uma nova guia-->
        <li><a href="https://github.com/gustavoguanabara" target="_blank">Repositorio GitHub</a></li>
        <li><a href="https://www.youtube.com/@cursoemvideo" target="_blank">Canal no Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com/" target="_blank">Site do Curso em Video</a></li>
        <li><a href="https://github.com/vitorfae" target="_blank" class="especial">Meu GitHub</a></li>
    </ul>
</body>
</html>
