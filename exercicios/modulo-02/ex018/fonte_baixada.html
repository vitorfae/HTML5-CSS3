<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face { /*FONT-FACE para fonte baixada*/
            font-family: 'Love'; /*VocÊ da o nome que quiser na fonte.*/
            src: url(fonts/love\ larry\ ttf.ttf) format(truetype); /*Usando a pasta fonts, só usar fonts/...*/
            font-weight: normal; /*PESO*/
            font-style: normal;  /*ESTILO (NEGRITO)*/

            /*
                TIPOS DE format()
                - opentype (otf)
                - truetype (ttf)
                - embedded-opentype
                - truetype-aat (Apple Advenced Typography)
                - svg
            */
        }

        /*SITE PARA PEGAR FONTES*/
        /*dafont.com*/
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolore sapiente distinctio pariatur harum maxime totam praesentium culpa doloremque, qui ipsum sunt at sit non corrupti minima ut quis porro aperiam!</p>
</body>
</html>
